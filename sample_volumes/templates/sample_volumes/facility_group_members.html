{% extends 'sample_volumes/main.html' %} {% block content %}
<div class="col-md-4">
  <div class="row">
    <h2>{{facility_group.name}} Facilities</h2>
  </div>
  <br />
  <form action="" method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="facilities"><strong>Facilities</strong></label>
      {{ fg_facilities|json_script:"fg_facilities" }}
      <select
        id="facility_group_facilities_select"
        class="form-control"
        name="facilities[]"
        multiple="multiple"
      >
        {% for facility in facilities_list %}
        <option value="{{facility.id}}">{{facility.name}}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>

{% endblock content%}
