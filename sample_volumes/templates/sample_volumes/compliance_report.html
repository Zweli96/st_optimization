{% extends 'sample_volumes/main.html' %} {% block content %}
<div class="col-md-4">
  <div class="row">
    <h2>Compliance Report</h2>
  </div>
  <br />
  <form action="{% url 'compliance_report' %}" method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="date"><strong>Start Date</strong></label>
      <input
        type="date"
        class="form-control"
        name="start_date"
        id="datePicker"
        placeholder="Select Date"
        required
      />
    </div>
    <div class="form-group">
      <label for="date"><strong>End Date</strong></label>
      <input
        type="date"
        class="form-control"
        name="end_date"
        id="datePicker"
        placeholder="Select Date"
        required
      />
    </div>
    <div class="form-group">
      <label for="district"><strong>District</strong></label>
      <select
        class="custom-select mr-sm-2"
        name="district"
        id="select_district"
        required
      >
        <option value="">Select District</option>
        {% for district in districts %}
        <option value="{{district.id}}">{{district.name}}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="format"><strong>Format</strong></label>
      <select
        class="custom-select mr-sm-2"
        name="format"
        id="select_format"
        required
      >
        <option value="pdf">Excel</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Generate</button>
  </form>
</div>

{% endblock content%}
