{% extends 'sample_volumes/main.html' %} {% block content %}
<div class="col-md-9">
  <div class="row">
    <h2>Users</h2>
    <a
      href="{% url 'register' %}"
      class="btn btn-sm btn-info ml-auto mr-3 d-flex align-items-center"
    >
      Add User
    </a>
  </div>
  <br />
  <div class="card card-body">
    <table
      class="table table-sm table-striped table-bordered table-sm"
      id="data_table"
    >
      <thead>
        <tr>
          <th>Name</th>
          <th>Username</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        {% for user in users %}

        <tr>
          <td>{{user.get_full_name}}</td>
          <td>{{user.username}}</td>
          <td>{{user.email}}</td>
          <td>
            <a href="{% url 'update_user' user.id %}"
              ><i class="fas fa-edit"></i
            ></a>
            <a href="{% url 'delete_user' user.id %}"
              ><i class="fas fa-trash"></i
            ></a>
            <a href="{% url 'reset_password' user.id %}"
              ><i class="fas fa-lock"></i
            ></a>
          </td>
        </tr>

        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

{% endblock content%}
